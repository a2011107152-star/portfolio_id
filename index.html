<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 아이콘 모음: 아래에서 <use href="#아이콘이름">으로 꺼내 쓴다 -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
    <symbol id="icon-cap" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.9V17h2V9z"/><path d="M5 13.2v4L12 21l7-3.8v-4L12 17z"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
    <symbol id="icon-bag" viewBox="0 0 24 24"><path d="M9 3h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v4H2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 2v2h6V5z"/><path d="M2 15h8v2h4v-2h8v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.6 2.3 4.5 6.2 4.5c2.2 0 3.8 1.3 4.8 2.8 1-1.5 2.6-2.8 4.8-2.8 3.9 0 5.8 4.1 4.2 7.2C19.5 16.4 12 21 12 21z"/></symbol>
  </svg>

  <main class="page">
    <!-- 흰 큰 카드 -->
    <div class="sheet resume">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="about-label">ABOUT ME</p>
        <div class="photo" id="profile-photo"></div>
        <h2 class="about-name" id="profile-name"></h2>
        <p class="about-title" id="profile-title"></p>
        <p class="badge" id="profile-badge"></p>

        <ul class="contact">
          <li>
            <span class="contact-icon"><svg><use href="#icon-user"/></svg></span>
            <div><span class="contact-label">이름</span><span class="contact-value" id="contact-name"></span></div>
          </li>
          <li>
            <span class="contact-icon"><svg><use href="#icon-mail"/></svg></span>
            <div><span class="contact-label">이메일</span><span class="contact-value" id="contact-email"></span></div>
          </li>
          <li>
            <span class="contact-icon"><svg><use href="#icon-phone"/></svg></span>
            <div><span class="contact-label">연락처</span><span class="contact-value" id="contact-phone"></span></div>
          </li>
          <li>
            <span class="contact-icon"><svg><use href="#icon-pin"/></svg></span>
            <div><span class="contact-label">위치</span><span class="contact-value" id="contact-location"></span></div>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="content">
        <h1 class="big-title">PORTFOLIO</h1>
        <p class="headline" id="profile-headline"></p>
        <p class="intro" id="profile-intro"></p>

        <div class="facts">
          <div class="fact">
            <h3 class="fact-title"><svg><use href="#icon-cap"/></svg>EDUCATION</h3>
            <div id="profile-education"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title"><svg><use href="#icon-star"/></svg>SKILLS &amp; TOOLS</h3>
            <ul class="skills" id="profile-skills"></ul>
          </div>
          <div class="fact">
            <h3 class="fact-title"><svg><use href="#icon-bag"/></svg>EXPERIENCE</h3>
            <div id="profile-experience"></div>
          </div>
        </div>

        <div class="highlights">
          <div class="highlights-head">
            <h3>PORTFOLIO HIGHLIGHTS</h3>
            <span>(카드를 터치하면 상세 기획서를 보실 수 있습니다)</span>
          </div>
          <div class="cards" id="cards"></div>
        </div>

        <p class="quote" id="profile-quote"></p>
      </section>
    </div>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h3 class="guestbook-title">GUESTBOOK</h3>
      <p class="guestbook-sub">별명과 한마디를 남겨 주세요.</p>
      <div class="guestbook-form">
        <input type="text" id="gb-nickname" placeholder="별명 (20자까지)" maxlength="20">
        <input type="text" id="gb-message" placeholder="한마디 (200자까지)" maxlength="200">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="guestbook-notice" id="gb-notice"></p>
      <ul class="guestbook-list" id="gb-list"></ul>
    </section>

    <p class="load-error" id="load-error"></p>

    <p class="admin-link"><a href="admin.html">관리자</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
